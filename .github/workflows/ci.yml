name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The API talks to a real Postgres in tests rather than a mock, and pgvector
    # has to be present because the first migration enables the extension.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: eyelecture
          POSTGRES_PASSWORD: eyelecture
          POSTGRES_DB: eyelecture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eyelecture -d eyelecture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build

      - name: Run migrations against a real database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: eyelecture
          DB_PASSWORD: eyelecture
          DB_NAME: eyelecture
        run: npm run migration:run:prod

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    # Building without pushing is the cheapest way to catch a broken Dockerfile
    # on the PR instead of halfway through a deploy.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive infra/

      # No credentials here on purpose: `validate` needs the providers but not a
      # backend, so a PR from a fork can never touch real state. Applying is a
      # deliberate manual step — see infra/README.md.
      - name: Validate
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate
