services:
  # pgvector/pgvector ships Postgres with the `vector` extension already compiled in,
  # so the same image serves today's relational data and tomorrow's embedding search
  # without swapping databases later.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: eyelecture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eyelecture
      POSTGRES_PASSWORD: eyelecture
      POSTGRES_DB: eyelecture
    ports:
      # A Postgres installed via Homebrew or Postgres.app already owns 5432 on
      # many machines, and the app would then talk to that one instead of this
      # container — which fails as "password authentication failed for user
      # eyelecture". Set POSTGRES_PORT in a .env next to this file to move it,
      # and match it with DB_PORT in backend/.env.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eyelecture -d eyelecture']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional. Start with: docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eyelecture-pgadmin
    profiles: ['tools']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eyelecture.app
      PGADMIN_DEFAULT_PASSWORD: eyelecture
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
