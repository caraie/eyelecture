<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>EyeLecture</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="EyeLecture — lectures, questions and cohort analytics." />

    <!-- SVG first for browsers that take it (stays crisp on any display), with the
         .ico as the fallback. The .ico carries hand-tuned 16/32/48 frames rather
         than one image downscaled, so the pupil survives at tab size. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Tints the browser chrome on mobile. Ocular blue, same as the favicon plate. -->
    <meta name="theme-color" content="#1B4FD1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Instrument Sans for display, Geist for body, Geist Mono for data.
         Matches the design system's type stack exactly. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,600;1,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
